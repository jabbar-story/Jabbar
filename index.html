<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jabbar Store | جبار ستور</title>
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/jabbar-story/jabbar-home/refs/heads/main/logo.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <script src="js/firebase.js" defer></script>
    <script src="js/state.js" defer></script>
    <script src="js/router.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/admin_logic.js" defer></script>
    <script src="js/main.js" defer></script>

    <script>
        // إعدادات OneSignal
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({ appId: "0414ef49-0bdc-426a-b2f6-1ea06c995466" });
        });

        // إعدادات Tailwind المخصصة
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { 
                        primary: '#d4af37', 
                        primaryDark: '#b5952f', 
                        secondary: '#1e293b', 
                        accent: '#eab308', 
                        dark: '#0f172a' 
                    },
                    boxShadow: { 
                        'float': '0 20px 40px -10px rgba(212, 175, 55, 0.25)', 
                        'glow': '0 0 25px rgba(212, 175, 55, 0.5)', 
                        'premium': '0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.03)', 
                        'card': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' 
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.5s ease-out forwards', 
                        'pop': 'pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards', 
                        'marquee': 'marquee 120s linear infinite' 
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pop: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        marquee: { '0%': { transform: 'translateX(0)' }, '100%': { transform: 'translateX(-50%)' } }
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen relative bg-slate-50 selection:bg-primary selection:text-slate-900">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none"></div>

    <div class="fixed bottom-6 right-6 flex flex-col gap-3 z-40">
        <button id="fab-top" onclick="window.scrollTo({top:0, behavior:'smooth'})" 
            class="w-12 h-12 md:w-14 md:h-14 bg-slate-800 rounded-full flex items-center justify-center text-primary shadow-lg hover:bg-primary hover:text-slate-900 hover:scale-110 transition-all opacity-0 pointer-events-none translate-y-10 border border-slate-700">
            <i class="ph-bold ph-arrow-up text-xl md:text-2xl"></i>
        </button>
        <a id="fab-wa" href="#" target="_blank" 
            class="w-12 h-12 md:w-14 md:h-14 bg-[#25D366] rounded-full flex items-center justify-center text-white shadow-lg shadow-[#25D366]/30 hover:bg-[#1ebd5a] hover:scale-110 transition-all border border-[#1ebd5a] hidden">
            <i class="ph-fill ph-whatsapp-logo text-2xl md:text-3xl"></i>
        </a>
    </div>

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-xl border-b border-white/10 backdrop-blur-md" id="navbar">
        <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-20 md:h-24 flex items-center justify-between relative">
            
            <div class="flex items-center gap-3 md:gap-6 group cursor-pointer" onclick="navigate('client-catalog')">
                <div id="store-logo-container" class="w-12 h-12 md:w-16 md:h-16 rounded-2xl flex items-center justify-center shadow-glow transition-all group-hover:rotate-6 border border-white/10">
                    <i class="ph-fill ph-pill text-2xl md:text-4xl text-slate-900"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 id="store-name-display" class="text-xl md:text-3xl font-black tracking-tighter text-white drop-shadow-md">جبار</h1>
                    <p class="text-[10px] md:text-xs font-bold text-primary tracking-widest uppercase opacity-80">Luxury Care Store</p>
                </div>
            </div>

            <div id="client-nav-elements" class="flex items-center gap-2 md:gap-5">
                <button onclick="navigate('client-catalog')" class="nav-icon-btn hidden md:flex" title="المتجر"><i class="ph-bold ph-storefront"></i></button>
                <button onclick="navigate('client-moms-view')" class="nav-icon-btn text-pink-400 hover:bg-pink-500/10" title="عالم الماميز"><i class="ph-fill ph-baby"></i></button>
                
                <div class="relative">
                    <button onclick="navigate('client-cart')" class="nav-icon-btn relative group" title="السلة">
                        <i class="ph-bold ph-shopping-cart-simple"></i>
                        <span class="cart-badge absolute -top-1 -right-1 bg-primary text-slate-900 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900 hidden">0</span>
                    </button>
                </div>

                <div class="h-8 w-[1px] bg-white/10 mx-1 hidden md:block"></div>

                <div class="relative">
                    <button id="user-menu-btn" onclick="toggleUserDropdown()" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 p-1.5 md:p-2 rounded-2xl transition-all border border-white/5 group">
                        <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-primary to-primaryDark rounded-xl flex items-center justify-center text-slate-900 shadow-lg">
                            <i class="ph-fill ph-user text-lg md:text-xl"></i>
                        </div>
                        <span id="nav-user-name" class="hidden md:block font-black text-sm px-2 text-slate-200 group-hover:text-white">دخول</span>
                        <i class="ph-bold ph-caret-down text-xs text-slate-500 ml-1"></i>
                    </button>
                    
                    <div id="user-dropdown" class="absolute left-0 top-full mt-4 w-64 bg-white rounded-2xl shadow-premium border border-slate-100 hidden overflow-hidden animate-pop z-[60]">
                        <div id="dd-login"><button onclick="navigate('auth-view'); toggleUserDropdown();" class="dd-item text-primary"><i class="ph-bold ph-sign-in"></i> تسجيل الدخول</button></div>
                        <div id="dd-admin" class="hidden"><button onclick="navigate('admin-dashboard'); toggleUserDropdown();" class="dd-item text-slate-800"><i class="ph-bold ph-gauge"></i> لوحة الإدارة</button></div>
                        <div id="dd-orders" class="hidden"><button onclick="navigate('client-orders-view'); toggleUserDropdown();" class="dd-item text-slate-800"><i class="ph-bold ph-package"></i> تتبع طلباتي</button></div>
                        <div id="dd-logout" class="hidden"><button onclick="logout(); toggleUserDropdown();" class="dd-item text-red-500 border-t border-slate-50"><i class="ph-bold ph-sign-out"></i> تسجيل الخروج</button></div>
                    </div>
                </div>
            </div>

            <div id="admin-nav-elements" class="hidden items-center gap-4">
                <button onclick="navigate('client-catalog')" class="btn-primary py-2 px-5 text-sm rounded-xl"><i class="ph-bold ph-eye"></i> عرض المتجر</button>
            </div>
        </div>
    </nav>

    <div id="news-ticker-container" class="hidden-view bg-white border-b border-slate-100 py-3 md:py-4 w-full ticker-wrapper shadow-sm z-30">
        <div id="ticker-track" class="ticker-track animate-marquee"></div>
    </div>

    <main id="app-content" class="flex-1 flex flex-col relative w-full">
        <div class="flex items-center justify-center min-h-[60vh]">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                <p class="font-bold text-slate-400">جاري تحميل التجربة الفاخرة...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-6 text-center text-slate-400 font-bold text-sm">
        &copy; 2026 Jabbar Store. جميع الحقوق محفوظة.
    </footer>

</body>
</html>
